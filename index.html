<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הרשמה לטורניר פאדל</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: rgba(10, 14, 28, .55);
    --card: rgba(16, 20, 36, .82);
    --text: #f5f1ea;
    --muted: #c9c1b6;
    --line: rgba(255, 255, 255, .16);
    --accent: #f07a1a;
    --accent-text: #14100c;
    --blue: #2d8cff;
    --ok: #6fcf97;
    --err: #ff8a80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0a0e1c;
    color: var(--text);
    font-family: "Rubik", system-ui, sans-serif;
    line-height: 1.5;
  }
  /* fixed layer instead of background-attachment: fixed, which iOS ignores */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(to bottom, rgba(6, 9, 20, .35) 0%, rgba(6, 9, 20, .75) 45%, rgba(6, 9, 20, .9) 100%),
      url("bg.jpg") center top / cover no-repeat;
  }
  /* on phones show the whole poster width instead of a cropped middle */
  @media (max-aspect-ratio: 4/5) {
    body::before {
      background:
        linear-gradient(to bottom, rgba(6, 9, 20, 0) 0%, rgba(6, 9, 20, 0) 30%, rgba(6, 9, 20, .85) 50%, #0a0e1c 62%),
        url("bg.jpg") center top / 100% auto no-repeat,
        #0a0e1c;
    }
    /* start the content below the poster's logo */
    body main { padding-top: 56vw; }
  }
  header {
    background: rgba(6, 9, 20, .62);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px 4px;
    margin-bottom: 16px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 1.9rem; }
  header p { margin: 0; color: var(--muted); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 12px 0; color: var(--muted); font-size: .95rem; }
  .meta b { color: var(--text); font-weight: 500; }
  form, .done { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  fieldset { border: 0; margin: 0 0 20px; padding: 0; }
  legend { font-weight: 700; margin-bottom: 12px; font-size: 1.05rem; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .full { grid-column: 1 / -1; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  label { display: block; font-size: .9rem; margin-bottom: 4px; }
  .req::after { content: " *"; color: var(--accent); }
  input, select, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  input[type="tel"], input[type="email"] { direction: ltr; text-align: right; }
  textarea { min-height: 80px; resize: vertical; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: .95rem; margin-top: 16px; }
  .check input { width: auto; margin-top: 4px; }
  .q { margin-top: 20px; font-size: .95rem; }
  .q p { margin: 0 0 10px; }
  .yn { display: flex; gap: 10px; }
  .yn label { flex: 1; margin: 0; }
  .yn input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .yn span {
    display: block; text-align: center; padding: 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer; font-weight: 500;
    transition: background .15s, color .15s;
  }
  .yn input:checked + span { background: var(--blue); border-color: var(--blue); color: #fff; }
  .yn input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 1px; }
  .hp { position: absolute; right: -9999px; width: 1px; height: 1px; overflow: hidden; }
  button {
    width: 100%;
    margin-top: 8px;
    font: inherit;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 12px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin-top: 12px; min-height: 1.5em; color: var(--err); }
  .done { text-align: center; }
  .done h2 { color: var(--ok); margin-top: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">הרשמה לטורניר פאדל</h1>
    <p>כל שחקן נרשם בנפרד. חלוקת הזוגות תתבצע לפי שיטת החלוקה של הרב דגני.</p>
    <div class="meta" id="meta"></div>
  </header>

  <form id="form" novalidate>
    <div class="grid">
      <div class="full">
        <label for="name" class="req">שם מלא</label>
        <input id="name" name="name" required autocomplete="name">
      </div>
      <div>
        <label for="phone" class="req">טלפון</label>
        <input id="phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel">
      </div>
      <div>
        <label for="email" class="req">אימייל</label>
        <input id="email" name="email" type="email" required autocomplete="email">
      </div>
    </div>

    <div class="hp" aria-hidden="true">
      <label for="website">אתר</label>
      <input id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <div class="q" role="radiogroup" aria-labelledby="boss-q">
      <p id="boss-q" class="req">אני מאשר/ת שאריאל גנץ הוא אחראי הטורניר ואקשיב לכל מה שיבקש. במידה וישנן בעיות יש לפנות רק לניר זבולוני.</p>
      <div class="yn">
        <label><input type="radio" name="boss" value="כן" required><span>כן</span></label>
        <label><input type="radio" name="boss" value="לא"><span>לא</span></label>
      </div>
    </div>

    <label class="check">
      <input type="checkbox" id="terms" required>
      <span class="req">אני מאשר/ת שבמידה ואבטל את השתתפותי, כספי ההרשמה ייתרמו לקהילת יחד אחים.</span>
    </label>

    <button type="submit" id="submit">שליחת הרשמה</button>
    <div class="msg" id="msg" role="alert"></div>
  </form>

  <div class="done" id="done" hidden>
    <h2>נרשמת!</h2>
    <p>ההרשמה התקבלה. ניצור איתך קשר לפני הטורניר.</p>
  </div>
</main>

<script>
  // ===== הגדרות - לערוך כאן =====
  const CONFIG = {
    // הכתובת שמקבלים אחרי Deploy ב-Apps Script (נגמרת ב-/exec)
    scriptUrl: 'https://script.google.com/macros/s/AKfycbyV2BAO9fzSXQZCQuPR39qiSjyKm1rH2XspfbrRVDG1QuXZqznqPJBjRzqghfKwr9OezQ/exec',
    title: 'הרשמה לטורניר פאדל',
    date: 'יום ראשון, 8.11.2026',
    time: '17:00 עד 24:00',
    location: 'קניון רננים, קומה 5 (על הגג)',
    price: '200 ₪ לשחקן',
  };
  // ===============================

  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), btn = $('submit');

  document.title = CONFIG.title;
  $('title').textContent = CONFIG.title;
  for (const [label, value] of [['תאריך', CONFIG.date], ['שעות', CONFIG.time], ['מקום', CONFIG.location], ['מחיר', CONFIG.price]]) {
    if (!value) continue;
    const span = document.createElement('span');
    const b = document.createElement('b');
    b.textContent = value;
    span.append(label + ': ', b);
    $('meta').append(span);
  }

  // "לא" is not really an option
  const [bossYes, bossNo] = form.querySelectorAll('input[name="boss"]');
  bossNo.addEventListener('change', () => { bossYes.checked = true; });

  const phoneOk = (v) => /^[0-9+\-\s()]{9,15}$/.test(v.trim());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';

    const missing = [...form.querySelectorAll('[required]')].find((el) =>
      el.type === 'checkbox' ? !el.checked :
      el.type === 'radio' ? !form.querySelector(`input[name="${el.name}"]:checked`) :
      !el.value.trim());
    if (missing) {
      msg.textContent = missing.type === 'checkbox' ? 'חובה לאשר את סעיף התרומה כדי להירשם.' :
        missing.type === 'radio' ? 'צריך לענות על השאלה.' : 'יש למלא את כל שדות החובה.';
      missing.focus();
      return;
    }
    if (!phoneOk($('phone').value)) { msg.textContent = 'מספר הטלפון לא נראה תקין.'; $('phone').focus(); return; }
    if (!$('email').checkValidity()) { msg.textContent = 'כתובת האימייל לא תקינה.'; $('email').focus(); return; }
    if (CONFIG.scriptUrl.startsWith('PASTE')) {
      msg.textContent = 'הטופס עוד לא מחובר לגוגל שיטס (חסר scriptUrl).';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'שולח...';
    try {
      // form-urlencoded keeps this a "simple" request, so no CORS preflight
      const res = await fetch(CONFIG.scriptUrl, { method: 'POST', body: new URLSearchParams(new FormData(form)) });
      const data = await res.json();
      if (data.ok) {
        form.hidden = true;
        $('done').hidden = false;
      } else if (data.error === 'full') {
        msg.textContent = 'מצטערים, הטורניר מלא.';
      } else {
        msg.textContent = 'משהו השתבש, נסו שוב.';
      }
    } catch (err) {
      msg.textContent = 'לא הצלחנו לשלוח. בדקו את החיבור ונסו שוב.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'שליחת הרשמה';
    }
  });
</script>
</body>
</html>
