<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>הדפסה לפי מגרש</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800;900&display=swap">
<style>
  @page { size: A4 portrait; margin: 12mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e6e1; color: #14100c; font-family: "Rubik", system-ui, sans-serif; }
  .tools {
    position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center;
    padding: 12px; background: #14100c; color: #f5f1ea;
  }
  .tools button { font: inherit; font-weight: 800; padding: 9px 18px; border: 0; border-radius: 10px; background: #f07a1a; color: #14100c; cursor: pointer; }
  .tools a { color: #9cc8ff; }
  .tools label { display: flex; gap: 6px; align-items: center; font-size: .9rem; }
  .sheet {
    width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 14mm 12mm;
    box-shadow: 0 4px 20px rgba(0, 0, 0, .15); page-break-after: always; break-after: page;
  }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 4px solid #f07a1a; padding-bottom: 8px; margin-bottom: 14px; }
  .head .court { font-size: 64px; font-weight: 900; line-height: 1; }
  .head .meta { text-align: left; font-size: 13px; color: #555; line-height: 1.5; }
  .head .meta b { color: #f07a1a; letter-spacing: .1em; font-size: 12px; }
  h3 { margin: 18px 0 6px; font-size: 15px; color: #555; }
  table { width: 100%; border-collapse: collapse; }
  td { border-bottom: 1px solid #ddd; padding: 9px 6px; font-size: 16px; vertical-align: middle; }
  td.time { font-weight: 900; font-size: 20px; width: 64px; direction: ltr; text-align: right; color: #f07a1a; }
  td.what { width: 92px; font-size: 13px; color: #555; }
  td.team { font-weight: 700; }
  td.team.l { text-align: left; }
  td.box { width: 112px; text-align: center; white-space: nowrap; }
  .sq { display: inline-block; width: 40px; height: 34px; border: 2px solid #14100c; border-radius: 6px; vertical-align: middle; text-align: center; line-height: 30px; font-weight: 800; }
  .tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 99px; margin-top: 2px; }
  .tag.A { background: #fde3cf; color: #9a4a10; }
  .tag.B { background: #d6e7ff; color: #1957a6; }
  .tbd { color: #888; font-weight: 400; font-style: italic; }
  .rules { margin-top: 18px; font-size: 13px; color: #444; border-top: 1px dashed #bbb; padding-top: 8px; line-height: 1.6; }
  @media print {
    body { background: #fff; }
    .tools { display: none; }
    .sheet { margin: 0; box-shadow: none; width: auto; min-height: auto; padding: 0; }
  }
  @media screen and (max-width: 820px) {
    .sheet { width: auto; min-height: auto; margin: 10px; padding: 16px; }
    .head .court { font-size: 44px; }
    td { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="tools">
  <button type="button" onclick="window.print()">🖨️ הדפסה</button>
  <label><input type="checkbox" id="with-results"> לכלול תוצאות שכבר הוזנו</label>
  <a href="schedule.html">→ חזרה ללוח</a>
</div>
<div id="sheets"></div>

<script src="data.js"></script>
<script src="tournament.js"></script>
<script>
  const K = window.TourneyKit, T = K.T;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  let results = {};

  function scoreCell(s, idx) {
    const sq = el('span', 'sq', s ? s[idx] : '');
    return sq;
  }

  function line(time, what, house, x, y, s, labelX, labelY) {
    const tr = el('tr');
    const w = el('td', 'what', what);
    if (house) { w.append(el('br')); w.append(el('span', `tag ${house}`, `בית ${house}`)); }
    const box = el('td', 'box');
    box.append(scoreCell(s, 0), ' : ', scoreCell(s, 1));
    const tx = el('td', 'team'), ty = el('td', 'team l');
    tx.append(x || el('span', 'tbd', labelX));
    ty.append(y || el('span', 'tbd', labelY));
    tr.append(el('td', 'time', time), w, tx, box, ty);
    return tr;
  }

  function render() {
    const use = document.getElementById('with-results').checked ? results : {};
    const b = K.bracket(use);
    const courts = [...new Set([...K.games, ...K.KO].map((g) => g.court))].sort((p, q) => p - q);
    const root = document.getElementById('sheets');
    root.replaceChildren();
    for (const c of courts) {
      const sheet = el('section', 'sheet');
      const head = el('div', 'head');
      const meta = el('div', 'meta');
      meta.append(el('b', null, 'PADEL ACHIM · TOURNAMENT #4'), el('br'), 'יום ראשון 8.11 · קניון רננים, הגג');
      head.append(el('div', 'court', `מגרש ${c}`), meta);
      sheet.append(head);

      const group = K.games.filter((g) => g.court === c);
      if (group.length) {
        sheet.append(el('h3', null, 'שלב הבתים'));
        const t = el('table');
        for (const g of group) t.append(line(K.fmt(K.roundStart(g.round)), `סבב ${g.round + 1}`, g.house, g.x, g.y, K.score(use, g.id)));
        sheet.append(t);
      }
      const ko = K.KO.filter((k) => k.court === c);
      if (ko.length) {
        sheet.append(el('h3', null, 'נוקאאוט'));
        const t = el('table');
        for (const k of ko) t.append(line(k.time, k.name, '', b[k.id].x.pair, b[k.id].y.pair, K.score(use, k.id), b[k.id].x.label, b[k.id].y.label));
        sheet.append(t);
      }
      const rules = el('div', 'rules');
      rules.append('בתים: משחק עד 5 משחקונים, ב-4:4 טייברייק עד 7. נוקאאוט: הטוב מ-11, ב-5:5 טייברייק עד 7. ', el('br'),
        'בסיום המשחק: לרשום את התוצאה ולמסור לאריאל.');
      sheet.append(rules);
      root.append(sheet);
    }
  }

  document.getElementById('with-results').addEventListener('change', render);
  render();
  K.fetchResults().then((r) => { results = r; render(); }).catch(() => {});
</script>
</body>
</html>
